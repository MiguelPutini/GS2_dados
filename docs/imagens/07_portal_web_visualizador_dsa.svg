<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="950" height="380">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Janela do Navegador -->
  <rect width="950" height="380" rx="10" fill="#f4f6fa" stroke="#cbd5e1" stroke-width="2"/>
  <rect width="950" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="20" cy="21" r="5" fill="#ef4444"/>
  <circle cx="35" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="21" r="5" fill="#10b981"/>
  <rect x="75" y="10" width="550" height="22" rx="6" fill="#f1f5f9"/>
  <text x="88" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">http://localhost:8080/#dsa-visual</text>

  <!-- Cabeçalho do Site -->
  <rect y="42" width="950" height="65" fill="url(#gradHeader)"/>
  <text x="25" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">🏛️ Citizen Assist AI — Visualizador da Lista Encadeada</text>
  <text x="25" y="92" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Global Solution 2026.2 | Inspeção Gráfica dos Nós e Ponteiros em Tempo Real</text>

  <!-- Bloco Head -->
  <rect x="30" y="170" width="65" height="55" rx="8" fill="#0d47a1" filter="url(#shadow)"/>
  <text x="62" y="202" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">HEAD</text>
  <text x="108" y="202" fill="#0284c7" font-size="20" font-weight="bold">➔</text>

  <!-- Nó 1 -->
  <g transform="translate(130, 140)" filter="url(#shadow)">
    <rect width="160" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="160" height="26" rx="8" fill="#0284c7"/>
    <rect y="16" width="160" height="10" fill="#0284c7"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">NÓ #00 | 0x..edb0</text>
    <text x="10" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">[ID 105] Carteira CIN</text>
    <text x="10" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Doc. e Cidadania</text>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#e2e8f0" stroke-dasharray="3"/>
    <text x="10" y="98" fill="#0369a1" font-family="monospace" font-size="10">↳ .prox: ID #101</text>
  </g>
  <text x="305" y="202" fill="#0284c7" font-size="20" font-weight="bold">➔</text>

  <!-- Nó 2 -->
  <g transform="translate(330, 140)" filter="url(#shadow)">
    <rect width="160" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="160" height="26" rx="8" fill="#0284c7"/>
    <rect y="16" width="160" height="10" fill="#0284c7"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">NÓ #01 | 0x..ede0</text>
    <text x="10" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">[ID 101] Consulta UBS</text>
    <text x="10" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Saúde Pública</text>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#e2e8f0" stroke-dasharray="3"/>
    <text x="10" y="98" fill="#0369a1" font-family="monospace" font-size="10">↳ .prox: ID #109</text>
  </g>
  <text x="505" y="202" fill="#0284c7" font-size="20" font-weight="bold">➔</text>

  <!-- Nó 3 -->
  <g transform="translate(530, 140)" filter="url(#shadow)">
    <rect width="160" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="160" height="26" rx="8" fill="#0284c7"/>
    <rect y="16" width="160" height="10" fill="#0284c7"/>
    <text x="10" y="18" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">NÓ #02 | 0x..ee40</text>
    <text x="10" y="48" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">[ID 109] CadÚnico Social</text>
    <text x="10" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Assistência Social</text>
    <line x1="0" y1="80" x2="160" y2="80" stroke="#e2e8f0" stroke-dasharray="3"/>
    <text x="10" y="98" fill="#0369a1" font-family="monospace" font-size="10">↳ .prox: ID #102</text>
  </g>
  <text x="705" y="202" fill="#0284c7" font-size="20" font-weight="bold">➔</text>

  <!-- Bloco NULL -->
  <g transform="translate(730, 170)" filter="url(#shadow)">
    <rect width="75" height="55" rx="8" fill="#ef4444"/>
    <text x="37" y="202" fill="#ffffff" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">NULL</text>
  </g>

  <!-- Legenda inferior -->
  <rect x="30" y="295" width="890" height="55" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="327" fill="#334155" font-family="system-ui, sans-serif" font-size="12">
    💡 <tspan font-weight="bold">Evidência DSA:</tspan> Cada card acima reflete uma instância da classe <tspan font-family="monospace" fill="#0369a1">Node(dado, proximo)</tspan> alocada na memória Heap do Python.
  </text>
</svg>